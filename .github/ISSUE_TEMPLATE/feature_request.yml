name: Feature request
description: Suggest a new feature, mission, or improvement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Solaris is built for curious explorers aged 8–14. Features that make space history simpler,
        friendlier or more accurate are always welcome.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is it for, and what is hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the idea. Sketches and references welcome.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Atlas / orbit engine
        - Mission Control
        - Mission story pages
        - Timeline
        - Guided tour
        - Search
        - Accessibility
        - Content / NASA data
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: audience
    attributes:
      label: Audience check
      options:
        - label: This keeps the language friendly for ages 8–14.
          required: false
        - label: This works without a live NASA API call.
          required: false
        - label: This respects reduced-motion and keyboard users.
          required: false
